name: Publish Docker image

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  push_to_registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server/
          file: ./server/dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-psu:latest

  touch-k8s-manifest:
    needs: [ push_to_registry ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Insert release date
        run: |
          sed -i "s/release-date: .*$/release-date: $(date +%s)/g" ./server-k8s-manifests/devops-psu.yml
      - name: Commit manifest
        run: |
          git config --global user.name "Release Runner"
          git config --global user.email "runner@users.noreply.github.com"
          git add ./server-k8s-manifests/devops-psu.yml
          git commit -m "Release" || echo "Nothing to commit"
      - name: Push to release branch
        run: |
          git push --force origin master:release
